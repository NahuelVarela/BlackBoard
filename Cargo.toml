[package]
name = "bb"
version = "0.1.0"
edition = "2021"
description = "Blackboard CLI MVP — token-efficient issue-driven coordination (plan #1)"
license = "MIT"

[[bin]]
name = "bb"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
